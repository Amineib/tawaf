<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umrah 3D Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-screen first-person view; mission card top-left, minimap bottom-left,
   big action buttons bottom-right; same night-courtyard palette as the guided tour. */
:root {
  --ink: #101417; --panel: rgba(18, 23, 27, .86); --line: rgba(255, 255, 255, .14);
  --fg: #f2eee6; --muted: #b3ada1; --gold: #d6ad5e; --gold-ink: #1a1408; --green: #5fd38a; --warn: #f08a5d;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --arabic: "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif;
  color-scheme: dark;
}
:root[dir="rtl"] { --font: "Noto Naskh Arabic", "Geeza Pro", "Atkinson Hyperlegible", serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); font-family: var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; }
button, select { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
select { background: #20272c; color: var(--fg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; max-width: 100%; }
canvas#gl { touch-action: none; position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud { position: fixed; inset: 0; pointer-events: none;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.hud > * { pointer-events: auto; }

.mission { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); inset-inline-start: max(14px, env(safe-area-inset-left, 0px));
  width: min(380px, calc(100% - 28px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.mission .k { font-size: .82rem; color: var(--gold); letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; }
.mission h1 { margin: 0; font-size: 1.25rem; line-height: 1.25; text-wrap: balance; }
.mission p { margin: 0; color: var(--fg); font-size: 1rem; line-height: 1.4; }
.mission .count { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.dots { display: flex; gap: 7px; }
.dots i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--gold); }
.dots i.on { background: var(--gold); }
.dots i.now { box-shadow: 0 0 0 4px rgba(214, 173, 94, .3); }
.settings-row { display: grid; gap: 8px; }
.settings-row > span { color: var(--muted); font-size: .92rem; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 48px; min-width: 64px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: #20272c; font-weight: 700; }
.seg button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.mission .dist { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.topbtns { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); inset-inline-end: max(14px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
.tour-options { display: flex; gap: 8px; flex-wrap: wrap; }
.topbtns > #menuLabel, .mission-info > summary::marker, .toast > summary::marker { display: none; }
.mission-info > summary, .toast > summary { list-style: none; }
.mission-info > summary::-webkit-details-marker, .toast > summary::-webkit-details-marker { display: none; }
.mission-info p { padding-top: 6px; }
.toast-body { display: grid; gap: 6px; }
.cue-hint { display: none; }
.caption-wrap { position: relative; }
.caption-wrap > button { display: none; }
.intro-section { border-top: 1px solid var(--line); }
.intro-section > summary { display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; color: var(--muted); }
.intro-section > summary::after { content: '+'; margin-inline-start: auto; }
.intro-section[open] > summary::after { content: '−'; }
.intro-section > div { display: grid; gap: 12px; padding-bottom: 12px; }
.pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .45em 1em; min-height: 44px; font-weight: 700; font-size: .9rem; }
.pill[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

.minimap { position: absolute; bottom: max(14px, env(safe-area-inset-bottom, 0px)); inset-inline-start: max(14px, env(safe-area-inset-left, 0px));
  width: clamp(130px, 26vmin, 210px); aspect-ratio: 1; border-radius: 50%; border: 3px solid rgba(214, 173, 94, .75); box-shadow: 0 4px 18px rgba(0,0,0,.5); overflow: hidden; background: #0b0e10; }
.minimap canvas { width: 100%; height: 100%; display: block; }

.actions { position: absolute; bottom: max(14px, env(safe-area-inset-bottom, 0px)); inset-inline-end: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; justify-items: end; }
.btn-big { min-height: 64px; min-width: 150px; border-radius: 16px; border: 0; background: var(--gold); color: var(--gold-ink); font-weight: 700; font-size: 1.1rem; padding: 0 20px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.btn-big[aria-pressed="true"] { background: var(--green); color: #07160d; }
.btn-sec { min-height: 52px; min-width: 150px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; padding: 0 16px; }
.btn-sec[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

.feed { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  width: min(520px, calc(100% - 2 * clamp(130px, 26vmin, 210px) - 90px)); display: grid; gap: 8px; pointer-events: none !important; }
.feed > * { pointer-events: auto; }
.toast { max-height: 48vh; overflow-y: auto; background: var(--panel); border: 1px solid rgba(214,173,94,.6);
  border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.55); }
.toast .x { position: absolute; }
.cap { background: rgba(10, 13, 15, .84); border-radius: 12px; padding: 10px 14px; font-size: 1.05rem; line-height: 1.45; text-align: center; text-wrap: pretty; }
.mission .prog { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.mission .prog i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s linear; }
.toast .t { font-size: 1.15rem; font-weight: 700; }
.toast .ar { font-family: var(--arabic); font-size: 1.7rem; line-height: 1.8; direction: rtl; }
.toast .tr { color: var(--gold); font-style: italic; }
.toast .m { color: var(--muted); }
.toast .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.toast.warn { border-color: var(--warn); }
.toast.warn .t { color: var(--warn); }

.banner { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,13,15,.75); border-radius: 999px; padding: .5em 1.2em; font-weight: 700; font-size: 1.1rem; transition: opacity .4s; }

.joy { position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18); transform: translate(-50%, -50%); pointer-events: none; }
.joy b { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: rgba(214,173,94,.85); }

.screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 10, 12, .9); z-index: 5; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: min(560px, 100%); background: #171c20; border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 14px; }
.card h2 { margin: 0; font-size: 1.5rem; }
.card p { margin: 0; line-height: 1.5; color: var(--fg); }
.card .muted { color: var(--muted); font-size: .92rem; }
.card ul { margin: 0; padding-inline-start: 1.2em; line-height: 1.6; }
.cta { position: sticky; bottom: -22px; display: grid; gap: 10px; padding: 14px 0 22px; margin-bottom: -22px; background: linear-gradient(rgba(23,28,32,0), #171c20 28%); }
.dua { background: #20272c; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.dua .ar { font-family: var(--arabic); font-size: 1.6rem; line-height: 1.8; direction: rtl; text-align: right; }
.dua .tr { color: var(--gold); font-style: italic; }
.listen { justify-self: start; background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: .35em 1em; min-height: 44px; font-weight: 700; }
.bar { height: 10px; border-radius: 5px; background: #2a3237; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
.fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 4; }
.fade.on { opacity: 1; }
.cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.7); pointer-events: none; }
@media (max-width: 900px) {
  .topbtns { max-width: calc(100% - 28px); top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + clamp(130px, 26vmin, 210px) + 12px); inset-inline-end: auto; inset-inline-start: max(14px, env(safe-area-inset-left, 0px)); }
  .feed { bottom: auto; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 150px); width: calc(100% - 28px); }
  .toast { padding: 10px 12px; } .toast .ar { font-size: 1.35rem; line-height: 1.6; } .toast .m { font-size: .92rem; }
  .cap { font-size: .95rem; padding: 8px 12px; }
}
@media (max-width: 640px) {
  .mission h1 { font-size: 1.05rem; } .mission p { font-size: .92rem; }
  .btn-big { min-width: 120px; min-height: 58px; font-size: 1rem; } .btn-sec { min-width: 120px; }
  .topbtns { max-width: 100%; top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + clamp(130px, 26vmin, 210px) + 12px); inset-inline-end: auto; inset-inline-start: max(14px, env(safe-area-inset-left, 0px)); }
}
@media (max-width: 900px) {
  .mission { width: calc(100% - 116px); padding: 10px 12px; gap: 4px; }
  .mission h1 { font-size: 1.05rem; text-wrap: pretty; }
  .mission .k { font-size: .72rem; }
  .mission .dist { font-size: .76rem; }
  .mission .count { font-size: 1rem; gap: 8px; }
  .dots { gap: 5px; } .dots i { width: 12px; height: 12px; }
  .mission .prog { height: 4px; }
  .mission-info > summary { cursor: pointer; padding-inline-end: 16px; position: relative; }
  .mission-info > summary::after { content: '+'; color: var(--gold); position: absolute; inset-inline-end: 0; top: 18px; }
  .mission-info[open] > summary::after { content: '−'; }
  .topbtns { z-index: 3; top: max(12px, env(safe-area-inset-top, 0px)); bottom: auto; inset-inline-start: auto; inset-inline-end: 12px; max-width: none; display: block; }
  .topbtns > #menuLabel { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; list-style: none; }
  .topbtns > #menuLabel::-webkit-details-marker { display: none; }
  .topbtns.is-open > #menuLabel { border-color: var(--gold); color: var(--gold); }
  .tour-options { position: absolute; inset-inline-end: 0; top: 52px; width: 190px; display: grid; gap: 8px; padding: 12px; background: #171c20; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 30px #0008; }
  .minimap { width: 96px; border-width: 2px; }
  .actions { gap: 7px; }
  .actions .btn-big { min-height: 50px; min-width: 118px; border-radius: 12px; font-size: .95rem; padding: 0 14px; }
  .actions .btn-sec { min-height: 44px; min-width: 118px; border-radius: 12px; font-size: .85rem; max-width: 190px; }
  .feed { max-height: calc(100dvh - 260px); overflow-y: auto; gap: 6px; }
  .toast { padding: 0; text-align: start; max-height: none; }
  .toast > summary { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 12px; cursor: pointer; }
  .toast > summary::after { content: '+'; color: var(--gold); margin-inline-start: auto; }
  .toast[open] > summary::after { content: '−'; }
  .toast .t { font-size: .9rem; }
  .toast:not(.warn) .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cue-hint { display: inline; flex: none; color: var(--gold); font-size: .8rem; }
  .toast-body { padding: 0 12px 12px; max-height: 38dvh; overflow-y: auto; }
  .toast .tr, .toast .m { font-size: .9rem; }
  .caption-wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; background: rgba(10,13,15,.86); border-radius: 12px; align-items: start; }
  .caption-wrap .cap { background: none; text-align: start; font-size: .9rem; line-height: 1.4; margin: 8px 0; padding: 0 12px; }
  .caption-wrap:not(.expanded) .cap { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .caption-wrap.expanded .cap { max-height: 32dvh; overflow-y: auto; }
  .caption-wrap > button { display: block; min-width: 44px; min-height: 44px; padding: 8px; background: transparent; border: 0; color: var(--gold); font-size: .8rem; }
  .banner { top: 45%; font-size: .9rem; max-width: calc(100% - 28px); width: max-content; text-align: center; }
  .screen { align-items: start; padding-top: max(20px, env(safe-area-inset-top, 0px)); }
  .card { padding: 18px; gap: 12px; }
  .card p { font-size: .95rem; }
  .cta { position: static; padding: 0; margin: 0; background: none; }
}
@media (max-width: 900px) and (max-height: 500px) {
  .mission { width: min(320px, calc(100% - 116px)); }
  .feed { width: min(340px, calc(100% - 180px)); left: 14px; transform: none; max-height: calc(100dvh - 135px); }
  :root[dir="rtl"] .feed { left: auto; right: 14px; }
  .minimap { width: 74px; }
  .actions .btn-big { min-height: 44px; }
  .toast-body { max-height: 35dvh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="cross" id="cross" hidden></div>
<div class="fade" id="fade"></div>

<div class="hud" id="hud" hidden>
  <section class="mission">
    <details class="mission-info" id="missionInfo" open><summary>
    <div class="k"><span id="mStep"></span><span id="mDist" class="dist"></span></div>
    <h1 id="mTitle" aria-live="polite"></h1>
    </summary>
    <p id="mGoal"></p>
    </details>
    <div class="count" id="mCount" aria-live="polite" hidden></div>
    <div class="prog" id="mProg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i id="mProgFill"></i></div>
  </section>
  <div class="topbtns" id="tourMenu"><button id="menuLabel" class="pill" aria-expanded="false" aria-controls="tourOptions">Menu</button><div class="tour-options" id="tourOptions">
    <button class="pill" id="bSound" aria-pressed="true"></button>
    <button class="pill" id="bTime"></button>
    <button class="pill" id="bPause" aria-pressed="false"></button>
    <button class="pill" id="bSettings" aria-haspopup="dialog"></button>
    <button class="pill" id="bTour"></button>
  </div></div>
  <div class="minimap"><canvas id="mini" width="420" height="420"></canvas></div>
  <div class="actions">
    <button class="btn-big" id="bAct" hidden></button>
    <button class="btn-sec" id="bSkip" hidden></button>
    <button class="btn-sec" id="bRun" aria-pressed="false"></button>
    <button class="btn-big" id="bGuide" aria-pressed="false"></button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="feed" id="feed">
    <div class="toast" id="audioIssue" role="status" hidden><p id="audioIssueText"></p><button class="listen" id="retryAudio"></button></div>
    <details class="toast" id="toast" hidden open>
      <summary>
      <div class="t" id="tTitle"></div>
      <span class="cue-hint" id="tHint"></span>
      </summary><div class="toast-body">
      <div class="ar" id="tAr" lang="ar"></div>
      <div class="tr" id="tTr"></div>
      <div class="m" id="tMean"></div>
      <div class="row"><button class="listen" id="tListen"></button><button class="pill" id="tOk"></button></div>
      </div>
    </details>
    <div class="caption-wrap" id="captionWrap" hidden><div class="cap" id="cap" aria-live="polite" hidden></div><button id="captionMore" aria-expanded="false" aria-controls="cap">More</button></div>
  </div>
  <div class="joy" id="joy" hidden><b id="joyKnob"></b></div>
</div>

<div class="screen" id="intro">
  <div class="card">
    <h2 id="iTitle">Umrah in 3D</h2>
    <p id="iText"></p>
    <div class="bar" id="loadBar"><i id="loadFill"></i></div>
    <p class="muted" id="loadText" role="status">Loading the scene. You can also open the text and audio lessons.</p>
    <button class="btn-sec" id="bRetry" hidden>Retry loading</button>
    <details class="intro-section" open><summary id="ritualsLabel">Intention and Talbiyah</summary><div>
      <div class="dua" id="iNiyyah"></div><div class="dua" id="iTalbiyah"></div>
    </div></details>
    <div class="cta"><button class="btn-big" id="bStart" disabled></button>
    <button class="btn-sec" id="bResume" hidden></button></div>
    <details class="intro-section"><summary id="howLabel">How to move</summary><ul id="iHow"></ul></details>
    <details class="intro-section" id="introOptions"><summary id="optionsLabel">Settings and lessons</summary><div>
    <a class="listen" id="fallbackTour" href="index.html?text">Read or listen to the guided lessons</a>
    <label><span id="qualityLabel">Quality</span> <select id="quality"><option value="auto">Auto</option><option value="low">Low data</option><option value="high">High</option></select></label>
    </div></details>
    <details class="intro-section"><summary id="introAboutLabel">About this tour</summary><p class="muted" id="iNote"></p></details>
  </div>
</div>

<div class="screen" id="settings" role="dialog" aria-modal="true" aria-labelledby="sTitle" hidden>
  <div class="card">
    <h2 id="sTitle"></h2>
    <div class="settings-row"><span id="sSizeLabel"></span><div class="seg" id="sSize"><button data-size="1">A</button><button data-size="1.18" style="font-size:1.2em">A</button></div></div>
    <div class="settings-row"><span id="sBobLabel"></span><div class="seg" id="sBob"><button data-bob="1"></button><button data-bob="0"></button></div></div>
    <div class="settings-row"><span id="sLookLabel"></span><div class="seg" id="sLook"><button data-look="0.6"></button><button data-look="1"></button><button data-look="1.5"></button></div></div>
    <button class="btn-big" id="sClose"></button>
  </div>
</div>

<div class="screen" id="done" hidden>
  <div class="card">
    <h2 id="dTitle"></h2>
    <p id="dText"></p>
    <p class="muted" id="dStats"></p>
    <button class="btn-big" id="bAgain"></button>
    <button class="btn-sec" id="bBack"></button>
  </div>
</div>

<script src="lib/runtime.js"></script>
<script src="lib/content.js"></script>
<script src="lib/assets.js"></script>
<script src="lib/layout.js"></script>
<script src="lib/crowd.js"></script>
<script>
document.getElementById('bRetry').onclick = () => location.reload();
function showStartupFallback() {
  document.getElementById('intro').hidden = false;
  document.getElementById('introOptions').open = true;
  document.getElementById('bRetry').hidden = false;
  document.getElementById('loadText').textContent = document.documentElement.lang === 'ar'
    ? 'تعذّر تشغيل الجولة. أعد المحاولة أو افتح دروس القراءة والاستماع.'
    : 'The tour could not start. Retry, or open the text and audio lessons.';
}
// Only a failure while starting replaces the welcome screen; once walking, an
// isolated error must not cover the tour (it is still reported in the console).
window.addEventListener('error', (event) => { if (!window.__tourStarted && (event.message || event.target?.tagName === 'SCRIPT')) showStartupFallback(); }, true);
window.addEventListener('unhandledrejection', () => { if (!window.__tourStarted) showStartupFallback(); });
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ======================================================================= text */
const store = TourRuntime.createStore({ getItem: (key) => localStorage.getItem(key), setItem: (key, value) => localStorage.setItem(key, value) });
const LANG = store.get('lang', 'en') === 'ar' ? 'ar' : 'en';
document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
const T = { ...TourContent.practice.text[LANG],
  circuit: (n) => LANG === 'ar' ? `اكتمل الشوط ${n} من 7` : `Circuit ${n} of 7 complete`,

/* ======================================================================= guide (auto-walk) */
function guideDir() {
  const m = M[game.mi]; const tg = missionTarget(); if (!tg) return null;
  const p = player;
  if (current === 'masa') {
    const goingMarwa = m.id === 'sai' ? game.sai.last === 'safa' : tg[0] > p.x;
    const lane = goingMarwa ? 6 : -6;
    if (m.id === 'safa') return norm(tg[0] - p.x, tg[1] - p.y);
    const railsBetween = p.x > 14 && p.x < 386 && Math.sign(p.y) !== Math.sign(lane) && Math.abs(p.y) > 0.2;
    if (railsBetween) return norm((p.x < 200 ? 10 : 390) - p.x, 0);
    const vy = (lane - p.y) * 0.5;
    return norm(goingMarwa ? 1 : -1, vy);
  }
  // Haram: steer in polar coordinates around the Kaaba
  const r = Math.hypot(p.x, p.y), a = Math.atan2(p.y, p.x);

  const radial = [Math.cos(a), Math.sin(a)], tang = [-Math.sin(a), Math.cos(a)];
  const inArcade = r > 45.5, targetArcade = tr > 45.5;
  let vr = Math.max(-1, Math.min(1, (tr - r) * 0.6)), vt = Math.max(-1, Math.min(1, da * r * 0.5));
  if (inArcade !== targetArcade && Math.abs(da) > 0.08 && r > 44 && r < 51) {

  } else if (inArcade && !targetArcade) { vr = -1; vt = 0; }
  else if (!inArcade && targetArcade && Math.abs(da) > 0.06) { vr = Math.max(vr, 0) * 0.2; }

    player.z += (floorZ(player.x, player.y) - player.z) * Math.min(1, dt * 10);

/* where each mission starts when you resume it */
function spawnFor(mi) {
  const at = (r, deg, face) => { const a = deg * Math.PI / 180; return { x: r * Math.cos(a), y: r * Math.sin(a), yaw: face ?? a + Math.PI, pitch: 0.05, z: 0 }; };
  if (mi <= 0) return at(57, 80);
  if (mi === 1) return at(42, 80);
  if (mi === 2) return at(12.5, 45);
  if (mi <= 5) return at(13, 52, Math.atan2(MAQAM[1] - 13 * Math.sin(0.9), MAQAM[0] - 13 * Math.cos(0.9)));

    game.tawaf = restored?.tawaf || freshTawaf(); game.sai = restored?.sai || freshSai();
