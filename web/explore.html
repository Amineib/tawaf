<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Umrah 3D Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-screen first-person view; mission card top-left, minimap bottom-left,
   big action buttons bottom-right; same night-courtyard palette as the guided tour. */
:root {
  --ink: #101417; --panel: rgba(18, 23, 27, .86); --line: rgba(255, 255, 255, .14);
  --fg: #f2eee6; --muted: #b3ada1; --gold: #d6ad5e; --gold-ink: #1a1408; --green: #5fd38a; --warn: #f08a5d;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --arabic: "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif;
  color-scheme: dark;
}
:root[dir="rtl"] { --font: "Noto Naskh Arabic", "Geeza Pro", "Atkinson Hyperlegible", serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); font-family: var(--font); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud { position: fixed; inset: 0; pointer-events: none;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.hud > * { pointer-events: auto; }

.mission { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); inset-inline-start: max(14px, env(safe-area-inset-left, 0px));
  width: min(380px, calc(100% - 28px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.mission .k { font-size: .82rem; color: var(--gold); letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; }
.mission h1 { margin: 0; font-size: 1.25rem; line-height: 1.25; text-wrap: balance; }
.mission p { margin: 0; color: var(--fg); font-size: 1rem; line-height: 1.4; }
.mission .count { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.mission .count small { font-size: .5em; color: var(--muted); font-weight: 400; }
.mission .dist { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.topbtns { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); inset-inline-end: max(14px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
.pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .45em 1em; min-height: 44px; font-weight: 700; font-size: .9rem; }
.pill[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

.minimap { position: absolute; bottom: max(14px, env(safe-area-inset-bottom, 0px)); inset-inline-start: max(14px, env(safe-area-inset-left, 0px));
  width: clamp(130px, 26vmin, 210px); aspect-ratio: 1; border-radius: 50%; border: 3px solid rgba(214, 173, 94, .75); box-shadow: 0 4px 18px rgba(0,0,0,.5); overflow: hidden; background: #0b0e10; }
.minimap canvas { width: 100%; height: 100%; display: block; }

.actions { position: absolute; bottom: max(14px, env(safe-area-inset-bottom, 0px)); inset-inline-end: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; justify-items: end; }
.btn-big { min-height: 64px; min-width: 150px; border-radius: 16px; border: 0; background: var(--gold); color: var(--gold-ink); font-weight: 700; font-size: 1.1rem; padding: 0 20px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.btn-big[aria-pressed="true"] { background: var(--green); color: #07160d; }
.btn-sec { min-height: 52px; min-width: 150px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; padding: 0 16px; }
.btn-sec[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

.feed { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  width: min(520px, calc(100% - 2 * clamp(130px, 26vmin, 210px) - 90px)); display: grid; gap: 8px; pointer-events: none !important; }
.feed > * { pointer-events: auto; }
.toast { background: var(--panel); border: 1px solid rgba(214,173,94,.6);
  border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.55); }
.toast .x { position: absolute; }
.cap { background: rgba(10, 13, 15, .84); border-radius: 12px; padding: 10px 14px; font-size: 1.05rem; line-height: 1.45; text-align: center; text-wrap: pretty; }
.mission .prog { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.mission .prog i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s linear; }
.toast .t { font-size: 1.15rem; font-weight: 700; }
.toast .ar { font-family: var(--arabic); font-size: 1.7rem; line-height: 1.8; direction: rtl; }
.toast .tr { color: var(--gold); font-style: italic; }
.toast .m { color: var(--muted); }
.toast .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.toast.warn { border-color: var(--warn); }
.toast.warn .t { color: var(--warn); }

.banner { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,13,15,.75); border-radius: 999px; padding: .5em 1.2em; font-weight: 700; font-size: 1.1rem; transition: opacity .4s; }

.joy { position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18); transform: translate(-50%, -50%); pointer-events: none; }
.joy b { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: rgba(214,173,94,.85); }

.screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 10, 12, .9); z-index: 5; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: min(560px, 100%); background: #171c20; border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 14px; }
.card h2 { margin: 0; font-size: 1.5rem; }
.card p { margin: 0; line-height: 1.5; color: var(--fg); }
.card .muted { color: var(--muted); font-size: .92rem; }
.card ul { margin: 0; padding-inline-start: 1.2em; line-height: 1.6; }
.cta { position: sticky; bottom: -22px; display: grid; gap: 10px; padding: 14px 0 22px; margin-bottom: -22px; background: linear-gradient(rgba(23,28,32,0), #171c20 28%); }
.dua { background: #20272c; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.dua .ar { font-family: var(--arabic); font-size: 1.6rem; line-height: 1.8; direction: rtl; text-align: right; }
.dua .tr { color: var(--gold); font-style: italic; }
.listen { justify-self: start; background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: .35em 1em; min-height: 44px; font-weight: 700; }
.bar { height: 10px; border-radius: 5px; background: #2a3237; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
.fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 4; }
.fade.on { opacity: 1; }
.cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.7); pointer-events: none; }
@media (max-width: 900px) {
  .feed { bottom: auto; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 150px); width: calc(100% - 28px); }
  .toast { padding: 10px 12px; } .toast .ar { font-size: 1.35rem; line-height: 1.6; } .toast .m { font-size: .92rem; }
  .cap { font-size: .95rem; padding: 8px 12px; }
}
@media (max-width: 640px) {
  .mission h1 { font-size: 1.05rem; } .mission p { font-size: .92rem; }
  .btn-big { min-width: 120px; min-height: 58px; font-size: 1rem; } .btn-sec { min-width: 120px; }
  .topbtns { max-width: 100%; top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + clamp(130px, 26vmin, 210px) + 12px); inset-inline-end: auto; inset-inline-start: max(14px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">

</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="cross" id="cross" hidden></div>
<div class="fade" id="fade"></div>

<div class="hud" id="hud" hidden>
  <section class="mission" aria-live="polite">
    <div class="k"><span id="mStep"></span><span id="mDist" class="dist"></span></div>
    <h1 id="mTitle"></h1>
    <p id="mGoal"></p>
    <div class="count" id="mCount" hidden></div>
    <div class="prog" id="mProg" hidden><i id="mProgFill"></i></div>
  </section>
  <div class="topbtns">
    <button class="pill" id="bSound" aria-pressed="true"></button>
    <button class="pill" id="bTime"></button>
    <button class="pill" id="bTour"></button>
  </div>
  <div class="minimap"><canvas id="mini" width="420" height="420"></canvas></div>
  <div class="actions">
    <button class="btn-big" id="bAct" hidden></button>
    <button class="btn-sec" id="bSkip" hidden></button>
    <button class="btn-sec" id="bRun" aria-pressed="false"></button>
    <button class="btn-big" id="bGuide" aria-pressed="false"></button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="feed" id="feed">
    <div class="toast" id="toast" hidden>
      <div class="t" id="tTitle"></div>
      <div class="ar" id="tAr" lang="ar"></div>
      <div class="tr" id="tTr"></div>
      <div class="m" id="tMean"></div>
      <div class="row"><button class="listen" id="tListen"></button><button class="pill" id="tOk"></button></div>
    </div>
    <div class="cap" id="cap" aria-live="polite" hidden></div>
  </div>
  <div class="joy" id="joy" hidden><b id="joyKnob"></b></div>
</div>

<div class="screen" id="intro">
  <div class="card">
    <h2 id="iTitle"></h2>
    <p id="iText"></p>
    <div class="bar" id="loadBar"><i id="loadFill"></i></div>
    <p class="muted" id="loadText"></p>
    <div class="dua" id="iNiyyah"></div>
    <div class="dua" id="iTalbiyah"></div>
    <ul id="iHow"></ul>
    <div class="cta"><button class="btn-big" id="bStart" disabled></button>
    <button class="btn-sec" id="bResume" hidden></button></div>
    <p class="muted" id="iNote"></p>
  </div>
</div>

<div class="screen" id="done" hidden>
  <div class="card">
    <h2 id="dTitle"></h2>
    <p id="dText"></p>
    <p class="muted" id="dStats"></p>
    <button class="btn-big" id="bAgain"></button>
    <button class="btn-sec" id="bBack"></button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ======================================================================= text */
const store = {
  get(k, d) { try { const v = localStorage.getItem('umrah:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('umrah:' + k, JSON.stringify(v)); } catch {} },
};
const LANG = store.get('lang', 'en') === 'ar' ? 'ar' : 'en';
document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
const T = {
  en: { intro: 'Umrah in 3D', introText: 'Walk through the Haram and the Mas‘a yourself. Each step of the Umrah is a mission. The minimap shows where to go, and “Guide me” walks for you.',
        loading: 'Loading the Haram…', ready: 'Ready.', start: 'I am in ihram, begin', how: ['Move: W A S D or arrow keys. Look: drag with the mouse (double-click to lock it, Esc to release).', 'Phone: drag on the left to walk, on the right to look.', '“Guide me” walks you to the next goal. “Run” goes faster.'],
        note: 'Simplified real-time 3D for orientation, not an exact model. Duas from Hisn al-Muslim; Quran recitation by Mishary Rashid Alafasy.',
        niyyah: 'At the Miqat, make your intention:', talbiyah: 'Then repeat the Talbiyah:', listen: 'Listen', stop: 'Stop', ok: 'Continue',
        guide: 'Guide me', guiding: 'Guiding…', run: 'Run', day: 'Day', night: 'Night', tour: 'Guided tour', mission: 'Mission', of: 'of', m: 'm away',
        beginSai: 'Begin Sa‘i', skipTawaf: 'Fast-forward remaining circuits', skipSai: 'Fast-forward remaining lengths',
        circuit: (n) => `Circuit ${n} of 7 complete`, length: (n) => `Length ${n} of 7 complete`,
        wrongWay: 'Wrong direction', wrongWayText: 'Keep the Kaaba on your left. Turn around and walk the other way.',
        hijr: 'This circuit does not count', hijrText: 'The Hijr Ismail is part of the Kaaba. Walk around the outside of its curved wall.',
        green: 'Green lights: men walk quickly here, women at their normal pace.',
        doneTitle: 'Your Umrah is complete', doneText: 'Men shave the head or shorten the hair; women cut a fingertip’s length. May Allah accept it from you.',
        stats: (t, c, l) => `Time: ${t} · Tawaf circuits: ${c} · Sa‘i lengths: ${l}`, again: 'Start again', back: 'Back to the guided tour',
        entering: 'Entering the Mas‘a…', rabbana: 'Between the Yemeni Corner and the Black Stone',
        soundOn: 'Sound on', soundOff: 'Sound off', takbir: 'At the Black Stone line', dhikr: 'Remember Allah',
        resume: (n, t) => `Continue: mission ${n}, ${t}`, missionDone: (t) => `✓ ${t}`, arriveSafa: 'At Safa', arriveMarwa: 'At Marwah', noWebgl: 'This device cannot show 3D (WebGL2 is not available).' },
  ar: { intro: 'العمرة ثلاثية الأبعاد', introText: 'امشِ بنفسك في المسجد الحرام والمسعى. كل خطوة من العمرة مهمة. الخريطة الصغيرة تدلّك على الطريق، وزر «أرشدني» يمشي بك.',
        loading: 'جارٍ تحميل المسجد الحرام…', ready: 'جاهز.', start: 'أنا محرم، ابدأ', how: ['الحركة: مفاتيح W A S D أو الأسهم. النظر: اسحب بالفأرة (انقر مرتين لتثبيتها، وEsc لإلغاء ذلك).', 'على الهاتف: اسحب في اليسار للمشي، وفي اليمين للنظر.', 'زر «أرشدني» يوصلك إلى الهدف التالي، وزر «أسرع» يزيد السرعة.'],
        note: 'مشهد ثلاثي الأبعاد مبسّط للمساعدة على التوجّه، وليس نموذجًا دقيقًا. الأدعية من حصن المسلم، والتلاوة بصوت مشاري راشد العفاسي.',
        niyyah: 'عند الميقات انوِ العمرة:', talbiyah: 'ثم أكثِر من التلبية:', listen: 'استمع', stop: 'إيقاف', ok: 'متابعة',
        guide: 'أرشدني', guiding: 'جارٍ الإرشاد…', run: 'أسرع', day: 'نهار', night: 'ليل', tour: 'الجولة الموجَّهة', mission: 'المهمة', of: 'من', m: 'م',
        beginSai: 'ابدأ السعي', skipTawaf: 'تسريع الأشواط المتبقية', skipSai: 'تسريع الأشواط المتبقية',
        circuit: (n) => `اكتمل الشوط ${n} من 7`, length: (n) => `اكتمل الشوط ${n} من 7`,
        wrongWay: 'اتجاه خاطئ', wrongWayText: 'اجعل الكعبة عن يسارك، واستدر وامشِ في الاتجاه الآخر.',
        hijr: 'هذا الشوط لا يُحتسب', hijrText: 'حِجر إسماعيل من الكعبة، فطُف من خارج جداره المقوّس.',
        green: 'الأضواء الخضراء: يُسرع الرجال هنا، وتمشي النساء مشيًا عاديًّا.',
        doneTitle: 'تمّت عمرتك', doneText: 'يحلق الرجل رأسه أو يقصّر، وتقصّ المرأة قدر أنملة. تقبّل الله منك.',

        entering: 'الدخول إلى المسعى…', rabbana: 'بين الركن اليماني والحجر الأسود',
        soundOn: 'الصوت مفعّل', soundOff: 'الصوت مكتوم', takbir: 'عند خط الحجر الأسود', dhikr: 'اذكر الله',
        resume: (n, t) => `متابعة: المهمة ${n}، ${t}`, missionDone: (t) => `✓ ${t}`, arriveSafa: 'على الصفا', arriveMarwa: 'على المروة', noWebgl: 'لا يدعم هذا الجهاز العرض ثلاثي الأبعاد (WebGL2 غير متوفر).' },
}[LANG];

const DUA = {
  niyyah: { ar: 'لَبَّيْكَ اللَّهُمَّ عُمْرَةً', tr: 'Labbayka Allāhumma ʿumrah', en: 'Here I am, O Allah, for Umrah.' },
  talbiyah: { ar: 'لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ', tr: 'Labbayka Allāhumma labbayk…', en: 'Here I am, O Allah, here I am. You have no partner. All praise, blessings and sovereignty are Yours.' },
  enter: { ar: 'بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ', tr: 'Bismillāh, waṣ-ṣalātu was-salāmu ʿalā rasūlillāh…', en: 'In the name of Allah… O Allah, open for me the gates of Your mercy.' },
  bismillah: { ar: 'بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ', tr: 'Bismillāh, wallāhu akbar', en: 'In the name of Allah, and Allah is the Greatest.' },
  rabbana: { ar: 'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ', tr: 'Rabbanā ātinā fid-dunyā ḥasanatan…', en: 'Our Lord, give us good in this world and in the Hereafter, and protect us from the Fire.' },
  maqam: { ar: 'وَاتَّخِذُوا مِن مَّقَامِ إِبْرَاهِيمَ مُصَلًّى', tr: 'Wattakhidhū min maqāmi Ibrāhīma muṣallā', en: 'And take the station of Ibrahim as a place of prayer.' },
  safa_verse: { ar: 'إِنَّ الصَّفَا وَالْمَرْوَةَ مِن شَعَائِرِ اللَّهِ — أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ', tr: 'Innaṣ-Ṣafā wal-Marwata min shaʿāʾirillāh…', en: 'Safa and Marwah are among the symbols of Allah. I begin with what Allah began with.' },
  safa_dhikr: { ar: 'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', tr: 'Lā ilāha illā Allāhu waḥdahu lā sharīka lah…', en: 'There is no god but Allah alone, without partner…' },
};

/* short, well-known dhikr shown as text during the long walks (no audio) */
const DHIKR = [
  ['سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ', 'Subḥān Allāh, wal-ḥamdu lillāh, wa lā ilāha illā Allāh, wallāhu akbar', 'Glory be to Allah, praise be to Allah, there is no god but Allah, and Allah is the Greatest.'],

  const s = current === 'masa' ? 1.6 : 3.6;                 // px per metre
  const a = Math.PI / 2 - p.yaw, ca = Math.cos(a), sa = Math.sin(a);
  const S = (x, y) => { const dx = x - p.x, dy = y - p.y; return [cx + (dx * ca - dy * sa) * s, cy - (dx * sa + dy * ca) * s]; };
  mg.setTransform(1, 0, 0, 1, 0, 0); mg.clearRect(0, 0, W, W);
  mg.fillStyle = '#14191c'; mg.fillRect(0, 0, W, W);
  const poly = (pts, fill, stroke, lw = 2) => { mg.beginPath(); pts.forEach((q, i) => { const [X, Y] = S(q[0], q[1]); i ? mg.lineTo(X, Y) : mg.moveTo(X, Y); }); mg.closePath(); if (fill) { mg.fillStyle = fill; mg.fill(); } if (stroke) { mg.strokeStyle = stroke; mg.lineWidth = lw; mg.stroke(); } };
  const circle = (x, y, r, fill, stroke, lw = 2) => { const [X, Y] = S(x, y); mg.beginPath(); mg.arc(X, Y, r * s, 0, Math.PI * 2); if (fill) { mg.fillStyle = fill; mg.fill(); } if (stroke) { mg.strokeStyle = stroke; mg.lineWidth = lw; mg.stroke(); } };
  if (current === 'haram') {
    circle(0, 0, 66, '#3a3631'); circle(0, 0, 47.5, '#d9d4c8');
    for (let i = 0; i < NB; i++) { const t = i * 2 * Math.PI / NB; circle(47.6 * Math.cos(t), 47.6 * Math.sin(t), 0.9, '#8d8576'); }
    for (const c of COOLERS) circle(c[0], c[1], 0.9, '#5fa8d3');
    const hp = []; for (let t = HIJR.t0; t <= HIJR.t1; t += 0.05) hp.push([HIJR.cx + Math.cos(t) * HIJR.a, Math.sin(t) * HIJR.b]);
    mg.beginPath(); hp.forEach((q, i) => { const [X, Y] = S(q[0], q[1]); i ? mg.lineTo(X, Y) : mg.moveTo(X, Y); }); mg.strokeStyle = '#8d8576'; mg.lineWidth = 1.3 * s; mg.stroke();
    poly([[-KX, -KY], [KX, -KY], [KX, KY], [-KX, KY]], '#0b0b0c', '#d6ad5e', 3);
    circle(KX, KY, 0.9, '#d6ad5e');
    circle(MAQAM[0], MAQAM[1], 1.1, '#d6ad5e');
    if (M[game.mi]?.id === 'tawaf' || M[game.mi]?.id === 'stone') { const [x1, y1] = S(Math.cos(START_ANG) * 9, Math.sin(START_ANG) * 9), [x2, y2] = S(Math.cos(START_ANG) * 46, Math.sin(START_ANG) * 46); mg.strokeStyle = '#46d27a'; mg.lineWidth = 4; mg.beginPath(); mg.moveTo(x1, y1); mg.lineTo(x2, y2); mg.stroke(); }
    circle(PORTAL[0], PORTAL[1], 1.6, '#2f9e5c', '#fff', 2);
  } else {
    poly([[-24, -22], [424, -22], [424, 22], [-24, 22]], '#d9d4c8');
    poly([[MASA.green[0], -22], [MASA.green[1], -22], [MASA.green[1], 22], [MASA.green[0], 22]], 'rgba(70,210,122,.35)');
    for (const ry of [-2.5, 2.5]) { const [x1, y1] = S(15, ry), [x2, y2] = S(385, ry); mg.strokeStyle = '#8d8576'; mg.lineWidth = 2; mg.beginPath(); mg.moveTo(x1, y1); mg.lineTo(x2, y2); mg.stroke(); }
    circle(-15, 0, 8, '#7a6450'); circle(415, 0, 7, '#7a6450');
  }
  // objective
  const tg = missionTarget();
  if (tg) {
    let [X, Y] = S(tg[0], tg[1]); const dx = X - cx, dy = Y - cy, L = Math.hypot(dx, dy), lim = W / 2 - 22;
    if (L > lim) { X = cx + dx / L * lim; Y = cy + dy / L * lim; }
    mg.setLineDash([10, 8]); mg.strokeStyle = 'rgba(214,173,94,.9)'; mg.lineWidth = 4; mg.beginPath(); mg.moveTo(cx, cy); mg.lineTo(X, Y); mg.stroke(); mg.setLineDash([]);
    mg.beginPath(); mg.arc(X, Y, 13, 0, Math.PI * 2); mg.fillStyle = '#d6ad5e'; mg.fill(); mg.strokeStyle = '#1a1408'; mg.lineWidth = 3; mg.stroke();
  }
  // player arrow
  mg.fillStyle = '#ffffff'; mg.strokeStyle = '#000'; mg.lineWidth = 3;
  mg.beginPath(); mg.moveTo(cx, cy - 20); mg.lineTo(cx + 13, cy + 14); mg.lineTo(cx, cy + 7); mg.lineTo(cx - 13, cy + 14); mg.closePath(); mg.stroke(); mg.fill();
}

/* ======================================================================= world switching + lighting */
let night = store.get('night', true);
function setWorld(name) {
  for (const k of Object.keys(worlds)) { scene.remove(worlds[k].root); if (worlds[k].crowd) scene.remove(worlds[k].crowd.group); }
  const w = worlds[name];
  if (!w.crowd) w.crowd = makeCrowd(name);
  scene.add(w.root, w.crowd.group);
  if (name === 'haram') scene.add(portal); else scene.remove(portal);
  current = name; applyLight();
}
function applyLight() {
  const masa = current === 'masa';
  if (night && !masa) {
    scene.background = new THREE.Color(0x05070d); scene.environment = envNight; scene.fog = new THREE.Fog(0x05070d, 250, 1400);
    sun.color.set(0xfff6ea); sun.intensity = 2.0; sun.position.copy(toV(10, -20, 120)); hemi.intensity = 0.35; hemi.color.set(0x8090c0); hemi.groundColor.set(0x504436);
    renderer.toneMappingExposure = 0.95;
  } else if (masa) {
    scene.background = new THREE.Color(0xe8e2d6); scene.environment = envDay; scene.fog = new THREE.Fog(0xe8e2d6, 120, 420);
    sun.intensity = 0.0; hemi.intensity = 2.2; hemi.color.set(0xfff4e4); hemi.groundColor.set(0xcfc6b8);
    renderer.toneMappingExposure = 1.0;
  } else {
    scene.background = skyTex || new THREE.Color(0x9fc3e6); scene.environment = envDay; scene.fog = null;
    sun.color.set(0xfff1dc); sun.intensity = 2.8; sun.position.copy(toV(Math.cos(0.7) * 120, Math.sin(0.7) * 120, 110)); hemi.intensity = 0.45; hemi.color.set(0xdfe8ff); hemi.groundColor.set(0x8a7a66);
    renderer.toneMappingExposure = 0.9;
  }
  sun.target.position.set(0, 0, 0);
  floods.visible = night && !masa;
  for (const w of Object.values(worlds)) w.root.traverse((o) => { if (o.isMesh && o.material && o.material.emissiveIntensity !== undefined && /lamp|light|Clock face/i.test(o.material.name)) { o.material.userData.e0 ??= o.material.emissiveIntensity; o.material.emissiveIntensity = o.material.userData.e0 * (night && !masa ? 1.6 : 1); } });
  $('bTime').textContent = night ? T.day : T.night; $('bTime').hidden = masa;
}
let envDay = null, envNight = null;

/* ======================================================================= main loop */
const clock = new THREE.Clock();
let simT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); simT += dt;
  if (current && !$('hud').hidden) { step(dt, simT); drawMini(); }
  const t = simT;
  const bob = (Math.abs(input.f) + Math.abs(input.s) > 0.1 || input.guide) ? Math.sin(t * 7) * 0.025 : 0;
  camera.position.copy(toV(player.x, player.y, player.z + 1.6 + bob));
  camera.rotation.set(player.pitch, player.yaw - Math.PI / 2, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function step(dt, t) {
  {
    // input
    let f = input.f, s = input.s;
    if (keys.KeyW || keys.ArrowUp) f = 1; if (keys.KeyS || keys.ArrowDown) f = -1;
    if (keys.KeyD) s = 1; if (keys.KeyA) s = -1;
    if (keys.ArrowLeft) player.yaw += 1.8 * dt; if (keys.ArrowRight) player.yaw -= 1.8 * dt;
    if ((f || s) && input.guide && (keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD || input.f || input.s)) stopGuide();
    let base = current === 'masa' ? 2.6 : 2.0; if (input.run) base *= 2.4;
    let vx = 0, vy = 0;
    if (input.guide) {
      const d = guideDir();
      const tg = missionTarget(), here = tg && tg[2] !== 'path' && tg[2] !== 'zone' && Math.hypot(tg[0] - player.x, tg[1] - player.y) < 0.7;
      if (d && !here) {
        // a calm pace around the Kaaba leaves room for the narration; Run or fast-forward for more speed
        const calm = M[game.mi]?.id === 'tawaf' ? 0.8 : current === 'masa' ? 1.6 : 1.4;
        const speed = 2.0 * (input.ff ? 6 : input.run ? 2.4 : calm);
        vx = d[0] * speed; vy = d[1] * speed;
        if (simT > lookHold) { const dy = wrapA(Math.atan2(d[1], d[0]) - player.yaw); player.yaw += dy * Math.min(1, dt * (input.ff ? 6 : 3)); }
      }
    } else if (f || s) {
      const fx = Math.cos(player.yaw), fy = Math.sin(player.yaw), rx = Math.sin(player.yaw), ry = -Math.cos(player.yaw);
      const L = Math.min(1, Math.hypot(f, s)) / (Math.hypot(f, s) || 1);
      vx = (fx * f + rx * s) * base * L; vy = (fy * f + ry * s) * base * L;
    }
    // sub-steps keep fast-forward from tunnelling through walls
    const steps = Math.max(1, Math.ceil(Math.hypot(vx, vy) * dt / 0.3));
    for (let i = 0; i < steps; i++) { player.x += vx * dt / steps; player.y += vy * dt / steps; (current === 'masa' ? collideMasa : collideHaram)(player); }
    player.z += (floorZ(player.x, player.y) - player.z) * Math.min(1, dt * 10);
    checkMission(dt);
    const tg = missionTarget();
    if (tg && tg[2] !== 'path') { placeMarker(tg[0], tg[1], current === 'masa' ? floorZ(tg[0], tg[1]) : 0); const d = Math.hypot(tg[0] - player.x, tg[1] - player.y); $('mDist').textContent = d > 3 ? `${Math.round(d)} ${T.m}` : ''; }
    else { placeMarker(null); $('mDist').textContent = ''; }
    beam.material.opacity = 0.16 + 0.08 * Math.sin(t * 3);
    worlds[current].crowd?.update(dt, t);
  }
}
/* fixed-step simulation for automated tests: runs the game logic without rendering */
function sim(seconds, until) { const n = Math.round(seconds / 0.05); for (let i = 0; i < n; i++) { simT += 0.05; step(0.05, simT); if (until && until()) return i * 0.05; } return seconds; }

/* ======================================================================= UI wiring */
function duaBlock(el, key, label) {
  const d = DUA[key];
  el.innerHTML = `<div class="muted"></div><div class="ar" lang="ar"></div>${LANG === 'en' ? '<div class="tr"></div>' : ''}<button class="listen"></button>`;
  el.querySelector('.muted').textContent = label; el.querySelector('.ar').textContent = d.ar;
  if (LANG === 'en') el.querySelector('.tr').textContent = d.tr;
  const b = el.querySelector('.listen'); b.textContent = T.listen; b.onclick = () => { initAudio(); if (!snd.on) return; stopAudio(); say(['d:' + key]); };
}
$('iTitle').textContent = T.intro; $('iText').textContent = T.introText; $('loadText').textContent = T.loading;
duaBlock($('iNiyyah'), 'niyyah', T.niyyah); duaBlock($('iTalbiyah'), 'talbiyah', T.talbiyah);
$('iHow').innerHTML = T.how.map((h) => `<li>${h}</li>`).join(''); $('iNote').textContent = T.note;
$('bStart').textContent = T.start;
$('bGuide').textContent = T.guide; $('bRun').textContent = T.run; $('bTour').textContent = T.tour;
$('bSound').textContent = snd.on ? T.soundOn : T.soundOff; $('bSound').setAttribute('aria-pressed', snd.on);
$('dTitle').textContent = T.doneTitle; $('dText').textContent = T.doneText; $('bAgain').textContent = T.again; $('bBack').textContent = T.back;
$('bGuide').onclick = toggleGuide;
$('bRun').onclick = () => { input.run = !input.run; $('bRun').setAttribute('aria-pressed', input.run); };
$('bAct').onclick = () => { if (M[game.mi]?.id === 'safa') { stopAudio(); nextMission(); } };
$('bSound').onclick = () => { initAudio(); setSound(!snd.on); };
$('bSkip').onclick = () => { input.ff = true; snd.q.length = 0; dropTips(); startGuide(); $('bSkip').hidden = true; };
$('bTime').onclick = () => { night = !night; store.set('night', night); applyLight(); };
$('bTour').onclick = $('bBack').onclick = () => { location.href = 'index.html'; };
$('bAgain').onclick = () => { $('done').hidden = true; begin(0); };
$('bStart').onclick = () => { $('intro').hidden = true; begin(0); };
$('bResume').onclick = () => { $('intro').hidden = true; begin(saved.mi); };
const saved = store.get('explore', null) || { mi: 0 };
/* where each mission starts when you resume it */
function spawnFor(mi) {
  const at = (r, deg, face) => { const a = deg * Math.PI / 180; return { x: r * Math.cos(a), y: r * Math.sin(a), yaw: face ?? a + Math.PI, pitch: 0.05, z: 0 }; };
  if (mi <= 0) return at(57, 80);
  if (mi === 1) return at(42, 80);
  if (mi === 2) return at(12.5, 45);
  if (mi <= 5) return at(13, 52, Math.atan2(MAQAM[1] - 13 * Math.sin(0.9), MAQAM[0] - 13 * Math.cos(0.9)));
  return { x: -4, y: 3, yaw: Math.PI, pitch: 0.05, z: 0.6 };
}
function begin(from = 0) {
  initAudio(); stopAudio(); stopGuide(); input.ff = false;
  game.mi = Math.max(0, Math.min(from, M.length - 1)); game.zamzam = null; game.busy = false; game.t0 = performance.now();
  game.tawaf = freshTawaf(); game.sai = freshSai();
  $('done').hidden = true; $('toast').hidden = true; $('bSkip').hidden = true;
  setWorld(game.mi >= 6 ? 'masa' : 'haram');
  Object.assign(player, spawnFor(game.mi));
  $('hud').hidden = false; $('bAct').hidden = true; startMission(); duck(false);
}

/* ======================================================================= boot */
(async () => {
  try {
    const [haram, masa, pil] = await Promise.all([load('fps/haram.json', 'h'), load('fps/masa.json', 'm'), load('fps/pilgrims.json', 'p'), skyP]);
    prepWorld(haram, 'haram'); prepWorld(masa, 'masa'); pilgrimProto = pil.scene;
    envDay = skyTex ? pmrem.fromEquirectangular(skyTex).texture : null;
    envNight = (() => { const s = new THREE.Scene(); s.background = new THREE.Color(0x0c1018); return pmrem.fromScene(s, 0.04).texture; })();
    setWorld('haram');
    const a = 80 * Math.PI / 180; Object.assign(player, { x: 57 * Math.cos(a), y: 57 * Math.sin(a), yaw: a + Math.PI, pitch: 0.05 });
    $('loadFill').style.width = '100%'; $('loadText').textContent = T.ready; $('bStart').disabled = false;
    if (saved.mi > 0 && saved.mi < M.length) { $('bResume').hidden = false; $('bResume').textContent = T.resume(saved.mi + 1, M[saved.mi].title[LANG]); }
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e); $('loadText').textContent = String(e.message || e);
  }
})();

/* test hooks (used by automated checks) */
window.__game = { player, game, M, input, setWorld, goToMasa, missionTarget, nextMission, begin, sim, renderer, scene, camera, worlds, snd };
