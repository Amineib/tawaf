<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn Umrah step by step with English and Arabic narration, duas, and guided practice.">
<title>Umrah Step by Step</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: immersive 360° scene with a docked guide panel (right on wide screens, below on phones).
   Single deliberate dark look: the panel reads like a night-lit courtyard so the scene stays the star. */
:root {
  --ink: #101417;          /* page + scene backdrop */
  --panel: #171c20;        /* guide panel */
  --raise: #20272c;        /* cards inside the panel */
  --line: #2e373d;
  --fg: #f2eee6;           /* warm white, like the marble */
  --muted: #b3ada1;
  --gold: #d6ad5e;         /* kiswa band gold, the single accent */
  --gold-ink: #1a1408;
  --green: #5fd38a;        /* the green lights / start line, used only for "active" */
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --arabic: "Amiri", "Traditional Arabic", "Geeza Pro", serif;
  --scale: 1;
  --t-body: calc(1.2rem * var(--scale));
  --t-step: calc(1.4rem * var(--scale));
  --t-title: calc(1.55rem * var(--scale));
  --t-small: calc(0.95rem * var(--scale));
  --t-arabic: calc(1.9rem * var(--scale));
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--font); font-size: var(--t-body); line-height: 1.5; overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; }
select { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; max-width: 100%; }
.quality-label { font-size: var(--t-small); display: flex; gap: 8px; align-items: center; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 1fr minmax(380px, 460px); height: 100%; }
.app.text-only { grid-template-columns: 1fr; grid-template-rows: 130px minmax(0, 1fr); }
.text-only .scene { cursor: default; }
.text-only .quality-label, .text-only #timeSeg { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 40%) 1fr; }
}

/* ---------- scene */
.scene { position: relative; overflow: hidden; background: #000; touch-action: none; cursor: grab; min-height: 0; }
.scene:active { cursor: grabbing; }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: filter .8s ease; }
.scene.card canvas { filter: blur(9px) brightness(.4) saturate(.7); }
.scene.card { cursor: default; }
.scene.card .drag-hint { display: none; }
.illus { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  padding: calc(max(12px, env(safe-area-inset-top, 0px)) + 56px) 16px 16px; }
.illus svg { width: 100%; height: 100%; max-width: 640px; max-height: 100%; filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); }
.hotspots { position: absolute; inset: 0; pointer-events: none; }
.hotspot { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; transition: opacity .3s; }
.hotspot span { background: rgba(16, 20, 23, .82); color: var(--fg); border: 1px solid rgba(214, 173, 94, .55); border-radius: 999px; padding: .2em .75em; font-size: var(--t-small); white-space: nowrap; font-weight: 700; }
.hotspot i { width: 2px; height: 14px; background: var(--gold); }
.hotspot b { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(214, 173, 94, .3); }
.hotspot.focus span { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

.scene-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.scene-top > * { pointer-events: auto; }
.chip { background: rgba(16, 20, 23, .8); border: 1px solid var(--line); border-radius: 999px; padding: .35em .9em; font-size: var(--t-small); }
.chip strong { color: var(--gold); }
.loading { position: absolute; inset: 64px 12px auto; display: grid; justify-items: center; gap: 8px; padding: 12px; border-radius: 12px; color: var(--fg); font-size: var(--t-small); background: var(--ink); transition: opacity .5s; }
.loading button { min-height: 44px; background: var(--raise); border: 1px solid var(--gold); border-radius: 10px; padding: 6px 16px; cursor: pointer; }
.loading.gone { opacity: 0; pointer-events: none; }
.drag-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: var(--t-small); color: var(--fg); background: rgba(16,20,23,.7); padding: .3em .9em; border-radius: 999px; pointer-events: none; transition: opacity .6s; }

/* ---------- guide panel */
.guide { background: var(--panel); border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.guide-scroll { display: contents; }
@media (max-width: 860px) { .guide { border-inline-start: 0; border-top: 1px solid var(--line); } }
@media (max-width: 860px) {
  .app { grid-template-rows: minmax(140px, 30%) minmax(0, 1fr); }
  .guide-scroll { display: block; flex: 1; min-height: 0; overflow-y: auto; }
  .guide .guide-body { overflow: visible; }
}
@media (max-width: 480px) { .scene-top .chip { display: none; } .scene-top { justify-content: flex-end; } }
.guide-head { padding-block: 18px 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: .4em .8em; min-height: 44px; font-size: var(--t-small); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--gold); font-weight: 700; }
.toolbar .spacer { flex: 1; }
a.btn-3d { display: inline-flex; align-items: center; text-decoration: none; background: var(--gold, #d6ad5e); color: #1a1408; border-color: transparent; }
.btn-stations { background: rgba(16, 20, 23, .85); border: 1px solid rgba(214, 173, 94, .6); color: var(--fg); border-radius: 999px; padding: .35em 1em; min-height: 44px; font-size: var(--t-small); font-weight: 700; cursor: pointer; flex: none; }
.scene-top .chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; }

.progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.progress button { height: 44px; border: 0; background: transparent; cursor: pointer; padding: 18px 0; }
.progress button::before { content: ''; display: block; height: 8px; border-radius: 4px; background: var(--line); }
.progress button.done::before { background: rgba(214, 173, 94, .5); }
.progress button.now::before { background: var(--gold); }

.eyebrow { font-size: var(--t-small); color: var(--muted); letter-spacing: .04em; }
.eyebrow b { color: var(--gold); font-weight: 700; }
h1 { font-size: var(--t-title); line-height: 1.2; margin: 0; text-wrap: balance; }

.guide-body { flex: 1; overflow-y: auto; padding-block: 6px 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; min-height: 0; }
.step-meta { font-size: var(--t-small); color: var(--muted); display: flex; gap: 8px; align-items: center; }
.step-dots { display: flex; gap: 5px; }
.step-dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.step-dots span.now { background: var(--fg); }
.step-text { font-size: var(--t-step); line-height: 1.45; margin: 0; max-width: 34ch; }
.step-text.speaking { color: #fff; }

.dua { background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
.dua-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn-listen { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: .35em 1em; min-height: 48px; font-weight: 700; cursor: pointer; font-size: var(--t-small); }
.btn-listen svg { width: 20px; height: 20px; fill: currentColor; }
.btn-listen[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.synth { font-size: var(--t-small); color: var(--muted); }
.dua .ar { font-family: var(--arabic); font-size: var(--t-arabic); line-height: 1.9; direction: rtl; text-align: right; color: var(--fg); }
.dua .tr { font-style: italic; color: var(--gold); line-height: 1.45; }
.dua .mean { color: var(--fg); line-height: 1.45; }
.dua .src { font-size: var(--t-small); color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }

.counter { background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; transition: box-shadow .4s, border-color .4s; }
.counter.pulse { border-color: var(--green); box-shadow: 0 0 0 3px rgba(95, 211, 138, .25); }
.counter .lbl { font-size: var(--t-small); color: var(--muted); }
.counter .num { font-size: calc(2rem * var(--scale)); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.counter .num small { font-size: .55em; color: var(--muted); font-weight: 400; }
.counter .note { grid-column: 1 / -1; font-size: var(--t-small); color: var(--muted); }
.counter .row { display: flex; gap: 8px; }
.btn-count { background: var(--green); color: #07160d; border: 0; border-radius: 12px; font-weight: 700; padding: .5em 1em; min-height: 56px; min-width: 120px; cursor: pointer; font-size: var(--t-body); }
.btn-undo { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: .5em .8em; min-height: 56px; cursor: pointer; font-size: var(--t-small); }

.disclaimer { font-size: var(--t-small); color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

.controls { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; border-top: 1px solid var(--line);
  padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); background: var(--panel); }
.controls button { min-height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; display: grid; place-items: center; gap: 2px; padding: 6px; font-size: var(--t-small); }
.controls button svg { width: 26px; height: 26px; fill: currentColor; }
.controls .play { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; font-size: var(--t-body); }
.controls .play svg { width: 30px; height: 30px; }
.controls button:disabled { opacity: .4; cursor: default; }

/* station list */
.sheet { position: fixed; inset: 0; background: rgba(5, 7, 8, .72); display: grid; place-items: end center; z-index: 20; }
@media (min-width: 861px) { .sheet { place-items: center; } }
.sheet-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: min(560px, 100%); max-height: 86%; overflow-y: auto;
  padding-block: 18px max(18px, env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (min-width: 861px) { .sheet-card { border-radius: 18px; } }
.sheet-card h2 { font-size: var(--t-title); margin: 0 0 12px; }
.sheet-card ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sheet-card li button { width: 100%; text-align: start; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 56px; cursor: pointer; display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; align-items: center; }
.sheet-card li button .n { font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.sheet-card li button small { display: block; color: var(--muted); font-size: var(--t-small); }
.sheet-card li button[aria-current="true"] { border-color: var(--gold); }
.sheet-close { margin-top: 12px; width: 100%; min-height: 52px; border-radius: 12px; background: transparent; border: 1px solid var(--line); cursor: pointer; }

:root[dir="rtl"] { --font: "Noto Naskh Arabic", "Geeza Pro", "Atkinson Hyperlegible", serif; }
:root[dir="rtl"] .step-text { line-height: 1.75; }
:root[dir="rtl"] #btnPrev svg, :root[dir="rtl"] #btnNext svg { transform: scaleX(-1); }
:root[dir="rtl"] .eyebrow { letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <section class="scene" id="scene" aria-label="360 degree view">
    <canvas id="gl"></canvas>
    <div class="illus" id="illus" aria-hidden="true" hidden></div>
    <div class="hotspots" id="hotspots"></div>
    <div class="scene-top">
      <div class="chip" id="placeChip"></div>
      <div style="display:flex;gap:8px;flex:none">

      </div>

    <div class="drag-hint" id="dragHint"></div>
    <div class="loading" id="loading" role="status"><span id="loadingText">Loading the scene…</span><button id="retryPano" hidden>Retry scene</button></div>
  </section>

  <section class="guide" aria-label="Guide">
    <div class="guide-scroll" id="guideScroll">

      <div class="toolbar">
        <div class="seg" role="group" aria-label="Language">
          <button id="lang-en" data-lang="en">English</button>
          <button id="lang-ar" data-lang="ar" lang="ar">العربية</button>
        </div>
        <div class="seg" role="group" aria-label="Text size">
          <button id="size-1" data-size="1" aria-label="Normal text">A</button>
          <button id="size-2" data-size="1.18" aria-label="Large text" style="font-size:1.15em">A</button>

      <div class="dua" id="dua" hidden>

      <button class="play" id="btnPlay"><svg viewBox="0 0 24 24" aria-hidden="true" id="icoPlay"><path d="M7 4v16l13-8z"/></svg><span id="lPlay"></span></button>
      <button id="btnNext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg><span id="lNext"></span></button>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

<script>
const { duas: DUAS, labels: LABELS, stations: STATIONS, views: VIEWS } = TourContent;

const UI = {
  en: { play: 'Play', pause: 'Pause', resume: 'Resume', prev: 'Previous', next: 'Next', stations: 'All steps', station: 'Station', of: 'of', step: 'Step',
        close: 'Close', tawafLabel: 'Tawaf circuits', saiLabel: 'Sa’i lengths', add: '+1 done', undo: 'Undo', tawafNote: 'Tap at each return to the Black Stone line.',
        saiNote: 'Tap each time you reach Safa or Marwah. Safa → Marwah is 1.', complete: 'Complete. May Allah accept it.', drag: 'Drag to look around',
        loading: 'Loading the scene…', meaning: 'Meaning:', listen: 'Listen in Arabic', day: 'Day', night: 'Night', stopListen: 'Stop', synth: 'Synthetic voice · preview', reciter: 'Recitation: Mishary Rashid Alafasy', hisn: 'Recording: Hisn al-Muslim (hisnmuslim.com)', mixed: 'Recitation: Mishary Rashid Alafasy · Hisn al-Muslim',
        disclaimer: 'Prototype. The 3D scenes are a simplified reconstruction for orientation, not an exact model. Rulings follow commonly taught positions; your group guide or a scholar may advise differently. The narration and some duas use AI-generated voices. Quran recitation: Mishary Rashid Alafasy, via AlQuran Cloud (Islamic Network); word timings from Quran.com. Duas: Hisn al-Muslim recordings from hisnmuslim.com.' },
  ar: { play: 'تشغيل', pause: 'إيقاف مؤقت', resume: 'متابعة', prev: 'السابق', next: 'التالي', stations: 'كل المراحل', station: 'المرحلة', of: 'من', step: 'الخطوة',
        close: 'إغلاق', tawafLabel: 'أشواط الطواف', saiLabel: 'أشواط السعي', add: '+1 تمّ', undo: 'تراجع', tawafNote: 'اضغط عند كل عودة إلى خط الحجر الأسود.',
        saiNote: 'اضغط عند كل وصول إلى الصفا أو المروة. من الصفا إلى المروة شوط واحد.', complete: 'اكتمل. تقبّل الله منك.', drag: 'اسحب للنظر حولك',
        loading: 'جارٍ تحميل المشهد…', meaning: 'المعنى:', listen: 'استمع إلى الدعاء', day: 'نهار', night: 'ليل', stopListen: 'إيقاف', synth: 'صوت مُولَّد – نسخة تجريبية', reciter: 'تلاوة: مشاري راشد العفاسي', hisn: 'تسجيل: حصن المسلم (hisnmuslim.com)', mixed: 'تلاوة: مشاري راشد العفاسي · حصن المسلم',
        disclaimer: 'نسخة تجريبية. المشاهد ثلاثية الأبعاد إعادة بناء مبسّطة للمساعدة على التوجّه، وليست نموذجًا دقيقًا. الأحكام وفق الأقوال الأكثر تداولًا، وقد يرشدك مرشد مجموعتك أو أهل العلم إلى غير ذلك. السرد وبعض الأدعية بأصوات مولَّدة بالذكاء الاصطناعي، أما الآيات القرآنية فبصوت الشيخ مشاري راشد العفاسي، عبر AlQuran Cloud (Islamic Network)، وتوقيت الكلمات من Quran.com. الأدعية: تسجيلات حصن المسلم من hisnmuslim.com.' },
};

const store = TourRuntime.createStore({ getItem: (key) => localStorage.getItem(key), setItem: (key, value) => localStorage.setItem(key, value) });
const navigation = TourRuntime.createScope(), playback = TourRuntime.createScope(), panorama = TourRuntime.createScope();
const savedLesson = TourRuntime.guidedState(store.get('guided', null), STATIONS);
function saveLesson() { store.set('guided', TourRuntime.guidedSnapshot(state, STATIONS)); }
const recoveryText = {
  en: { retry: 'Retry scene', failed: 'The scene could not load. You can keep reading or listening, or retry.', no3d: '3D is unavailable. All lessons, duas, and audio still work.', quality: 'Quality', auto: 'Auto', low: 'Low data', high: 'High', audio: 'Audio could not play. You can keep reading or retry.', retryAudio: 'Retry audio' },
  ar: { retry: 'أعد تحميل المشهد', failed: 'تعذّر تحميل المشهد. يمكنك متابعة القراءة والاستماع أو إعادة المحاولة.', no3d: 'العرض ثلاثي الأبعاد غير متاح. يمكنك متابعة الدروس والأدعية والاستماع.', quality: 'الجودة', auto: 'تلقائية', low: 'توفير البيانات', high: 'عالية', audio: 'تعذّر تشغيل الصوت. يمكنك متابعة القراءة أو إعادة المحاولة.', retryAudio: 'أعد تشغيل الصوت' },
};
let sceneError = null;
function showSceneError(kind) {
  sceneError = kind;
  $('loadingText').textContent = recoveryText[state.lang][kind];
  $('retryPano').hidden = kind === 'no3d';
  $('loading').hidden = false;
  $('loading').classList.remove('gone');
}

function resize() {

}

const D2R = Math.PI / 180;

/* project a (yaw, pitch) direction to screen, or null if behind */

/* drag to look */

/* =================================================================== flow */
function setPlaying(p) {

  $('icoPlay').innerHTML = p ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';

async function go(s, k, { auto = false } = {}) {

  const target = stepTarget(st, st.steps[k]);
  const needsPano = panoFor(st) !== curPano || !tex[0];
  if (needsPano) {
    lookAt(target, 0);

    if (!navigation.current(token)) return;
    lookAt(target, 0);
  } else lookAt(target, auto || changed ? 1700 : 900);

  const next = STATIONS[s + 1];

  $('placeChip').innerHTML = `<strong>${num(state.s + 1)}/${num(STATIONS.length)}</strong>${sep()}${st.title[state.lang]}`;
  $('stepDots').replaceChildren(...st.steps.map((_, i) => { const d = document.createElement('span'); if (i === state.k) d.className = 'now'; return d; }));
  $('stepCount').textContent = `${L.step} ${num(state.k + 1)} ${L.of} ${num(st.steps.length)}`;
  $('stepText').textContent = step[state.lang];
  const d = step.dua && DUAS[step.dua];
  $('dua').hidden = !d;
  if (d) {
    $('duaAr').textContent = d.ar; $('duaTr').textContent = d.tr; $('duaMean').textContent = d.en;
    $('duaTr').hidden = $('duaMean').hidden = state.lang === 'ar';
    $('duaSrc').replaceChildren(...(d.references || []).map((ref) => {
      const link = document.createElement('a'); link.href = ref.url; link.target = '_blank'; link.rel = 'noopener'; link.textContent = ref.label; link.style.color = 'inherit'; return link;
    }));
    if (!$('duaSrc').childNodes.length) $('duaSrc').textContent = d.src?.[state.lang] || '';
    $('duaSrc').hidden = !$('duaSrc').textContent;
    const has = AUDIO.includes(step.dua);
    $('btnListen').hidden = !has; $('lSynth').hidden = !has; $('lSynth').textContent = L[AUDIO_CREDIT[step.dua] || 'synth'];
    setListen(!player.paused && player.src.endsWith('/' + step.dua + '.mp3'));
  }
  renderCounter();
  $('lPrev').textContent = L.prev; $('lNext').textContent = L.next;
  $('btnPrev').disabled = state.s === 0 && state.k === 0;
  $('btnNext').disabled = state.s === STATIONS.length - 1 && state.k === st.steps.length - 1;
  setPlaying(state.playing);
  $('disclaimer').textContent = L.disclaimer;
  $('dragHint').textContent = L.drag;
  drawIllus();
  const R = recoveryText[state.lang];
  $('loadingText').textContent = sceneError ? R[sceneError] : L.loading;
  $('retryPano').textContent = R.retry; $('qualityLabel').textContent = R.quality;
  $('quality').value = state.quality;
  for (const option of $('quality').options) option.textContent = R[option.value];
  $('sheetTitle').textContent = L.stations; $('sheetClose').textContent = L.close;
  $('stationList').replaceChildren(...STATIONS.map((x, i) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.innerHTML = `<span class="n">${num(i + 1)}</span><span><span class="t"></span><small></small></span>`;
    b.querySelector('.t').textContent = x.title[state.lang]; b.querySelector('small').textContent = x.place[state.lang];
    if (i === state.s) b.setAttribute('aria-current', 'true');
    b.onclick = () => { closeSheet(); go(i, 0); };
    li.appendChild(b); return li;
  }));
  $('body').scrollTop = 0;
  $('guideScroll').scrollTop = 0;
}

/* =================================================================== wiring */
$('btnPlay').onclick = () => {
  if (state.playing) { stopSpeech(); setPlaying(false); return; }
  state.started = true; saveLesson(); setPlaying(true); hideHint(); runStep();
};
$('btnListen').onclick = () => {
  if (!player.paused) { stopDua(); return; }
  if (state.playing) { stopSpeech(); setPlaying(false); }
  playDua(STATIONS[state.s].steps[state.k].dua);
};
$('btnNext').onclick = () => advance(1);
$('btnPrev').onclick = () => advance(-1);
for (const b of document.querySelectorAll('[data-lang]')) b.onclick = () => {
  state.lang = b.dataset.lang; store.set('lang', state.lang); const was = state.playing;
  stopSpeech(); render(); buildHotspots(); if (was) runStep();
};
for (const b of document.querySelectorAll('[data-time]')) b.onclick = () => {
  state.night = b.dataset.time === 'night'; store.set('night', state.night); render();
  go(state.s, state.k);
};
for (const b of document.querySelectorAll('[data-size]')) b.onclick = () => { state.size = +b.dataset.size; store.set('size', state.size); render(); };
function closeSheet() { $('sheet').hidden = true; $('app').inert = false; $('btnStations').focus(); }
$('btnStations').onclick = () => {
  if (state.playing) { stopSpeech(); setPlaying(false); }
  $('sheet').hidden = false; $('app').inert = true;
  $('stationList').querySelector('[aria-current]')?.focus();
};
$('sheetClose').onclick = closeSheet;
$('sheet').onclick = (e) => { if (e.target.id === 'sheet') closeSheet(); };
$('quality').onchange = () => { state.quality = $('quality').value; store.set('quality', state.quality); curPano = null; go(state.s, state.k); };
$('retryPano').onclick = () => { curPano = null; go(state.s, state.k); };
document.addEventListener('keydown', (e) => {
  if (!$('sheet').hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    if (e.key === 'Tab') {
      const buttons = [...$('sheet').querySelectorAll('button')];
      const first = buttons[0], last = buttons[buttons.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (e.target.closest('button, a, select, input, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); $('btnPlay').click(); }
  if (e.key === 'ArrowRight') advance(state.lang === 'ar' ? -1 : 1);
  if (e.key === 'ArrowLeft') advance(state.lang === 'ar' ? 1 : -1);
});
window.addEventListener('pagehide', saveLesson);
canvas.addEventListener('webglcontextlost', (event) => {
  event.preventDefault(); glAvailable = false; panorama.next(); texCache.clear(); tex = [null, null]; curPano = null; showSceneError('no3d');
});
canvas.addEventListener('webglcontextrestored', () => { glAvailable = initializeScene(); curPano = null; go(state.s, state.k); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state.playing) { stopSpeech(); setPlaying(false); } });

glAvailable = initializeScene();
if (glAvailable) requestAnimationFrame(frame);
render();
go(state.s, state.k);
</script>
